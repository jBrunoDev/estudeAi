<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estude AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="chat">

    <h1>Estude AI</h1>

    <p class="subtitle">
      Seu tutor acadêmico com inteligência artificial.
    </p>

    <div id="messages" class="messages"></div>

    <form id="chat-form">

      <input
        id="message-input"
        type="text"
        placeholder="Digite sua dúvida..."
        autocomplete="off"
      >

      <button type="submit">
        Enviar
      </button>

    </form>

  </main>

  <script src="app.js"></script>

</body>
</html>
